document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rif', serif; font-size: 40px; line-height: 1; color: #F2B45C;\">2<\u002Fdiv>\n          <div style=\"margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #7E8C99;\">Imaging modalities<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position: absolute; left: 50%; bottom: 26px; margin-left: -8px; width: 16px; height: 26px; display: flex; justify-content: center; animation: bob 2.4s ease-in-out infinite;\">\n      <span style=\"width: 1px; height: 100%; background: linear-gradient(180deg, rgba(124,245,213,0), #7CF5D5);\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"position: relative; padding: 22px 0; border-top: 1px solid rgba(255,255,255,.07); border-bottom: 1px solid rgba(255,255,255,.07); background: #080B0F; overflow: hidden;\">\n    <div style=\"display: flex; width: max-content; animation: marquee 34s linear infinite; will-change: transform;\">\n      <div style=\"display: flex; align-items: center; gap: 38px; padding-right: 38px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; color: #66727E; white-space: nowrap;\">\n        <span>High-density EEG<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>fNIRS<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>Event-related potentials<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>Frontal midline theta<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>PsychoPy paradigms<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>MATLAB · EEGLAB<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>Python<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>Resting-state connectivity<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>PRISMA meta-analysis<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 38px; padding-right: 38px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; color: #66727E; white-space: nowrap;\">\n        <span>High-density EEG<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>fNIRS<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>Event-related potentials<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>Frontal midline theta<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>PsychoPy paradigms<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>MATLAB · EEGLAB<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>Python<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>Resting-state connectivity<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n        <span>PRISMA meta-analysis<\u002Fspan><span style=\"color: #7CF5D5;\">✳<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section id=\"profile\" data-screen-label=\"Profile\" style=\"position: relative; max-width: 1240px; margin: 0 auto; padding: 140px 40px 40px;\">\n    <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 60px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #7E8C99; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 22%;\">\n      <span style=\"color: #7CF5D5;\">01<\u002Fspan><span style=\"width: 26px; height: 1px; background: rgba(255,255,255,.2);\"><\u002Fspan>Research profile\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: minmax(280px, .78fr) minmax(320px, 1.22fr); gap: 72px; align-items: start;\">\n      <div style=\"animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 26%;\">\n        <div style=\"position: relative; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); background: #0B0F14;\">\n          <img id=\"portrait\" src=\"150a7a57-1ea5-4826-986a-28ec640a28eb\" alt=\"Sakshi Sharma during an EEG recording session\" width=\"1078\" height=\"1336\" decoding=\"async\" style=\"display: block; width: 100%; height: 420px; object-fit: cover; object-position: 50% 0%;\">\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px;\">\n          <span style=\"padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #8A98A6;\">M.Sc. AIIMS<\u002Fspan>\n          <span style=\"padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #8A98A6;\">IIT Bombay<\u002Fspan>\n          <span style=\"padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #8A98A6;\">ORCID 0009-0006-9312-8637<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin: 0; font-family: 'Instrument Serif', serif; font-size: clamp(28px, 3.4vw, 46px); line-height: 1.16; letter-spacing: -.02em; color: #F4F8FB; text-wrap: pretty; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 28%;\">\n          I ask how the brain holds itself together under conflict, and what practices like meditation change about that signal.\n        <\u002Fp>\n        <div style=\"display: grid; gap: 22px; margin-top: 40px; max-width: 620px;\">\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.72; color: #A7B4C0; text-wrap: pretty; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 30%;\">\n            My work sits in cognitive and behavioural neuroscience, using EEG and fNIRS to study cognitive control, emotional processing, mindfulness, and computational approaches to brain function. I design the paradigms, run the acquisition, and take the data all the way through preprocessing and statistics.\n          <\u002Fp>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.72; color: #A7B4C0; text-wrap: pretty; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 32%;\">\n            Alongside lab work, I write systematic reviews and meta-analyses under PRISMA, and design open neuroscience curricula so that biopotential signals stop being a black box for the people just starting out.\n          <\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; margin-top: 44px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.09); border-radius: 16px; overflow: hidden; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 34%;\">\n          <div style=\"padding: 22px; background: #0A0E13;\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #7CF5D5;\">Interests<\u002Fdiv>\n            <div style=\"margin-top: 10px; font-size: 15px; line-height: 1.55; color: #D3DBE3;\">Cognitive control · Emotional processing · Mindfulness · Computational neuroscience<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 22px; background: #0A0E13;\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #9E8BFF;\">Stack<\u002Fdiv>\n            <div style=\"margin-top: 10px; font-size: 15px; line-height: 1.55; color: #D3DBE3;\">Python · MATLAB · PsychoPy · SPSS · JASP · GraphPad Prism<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"research\" data-screen-label=\"Research\" style=\"position: relative; max-width: 1240px; margin: 0 auto; padding: 130px 40px 40px;\">\n    <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 44px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #7E8C99; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 22%;\">\n      <span style=\"color: #7CF5D5;\">02<\u002Fspan><span style=\"width: 26px; height: 1px; background: rgba(255,255,255,.2);\"><\u002Fspan>Research experience\n    <\u002Fdiv>\n    <h2 style=\"position: relative; margin: 0 0 76px; max-width: 900px; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(34px, 5.4vw, 74px); line-height: 1.04; letter-spacing: -.025em; color: #F4F8FB; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 26%;\">\n      Seven studies, two modalities, one question repeated.\n    <\u002Fh2>\n\n    <div style=\"display: grid; grid-template-columns: minmax(220px, .62fr) minmax(320px, 1.38fr); gap: 56px; padding-bottom: 96px; border-bottom: 1px solid rgba(255,255,255,.08);\">\n      <div style=\"position: sticky; top: 120px; align-self: start; animation: revealSide linear both; animation-timeline: view(); animation-range: entry 0% cover 24%;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #7CF5D5;\">OCT 2025 - JUL 2026<\u002Fdiv>\n        <h3 style=\"margin: 14px 0 8px; font-size: 26px; font-weight: 600; letter-spacing: -.02em; color: #F4F8FB;\">Project Associate<\u002Fh3>\n        <div style=\"font-size: 15px; line-height: 1.5; color: #8A98A6;\">Cognitive &amp; Behavioural Neuroscience Lab<br>IIT Bombay, India<\u002Fdiv>\n        <div style=\"margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.1); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #66727E;\">EEG · fNIRS · PsychoPy · EEGLAB<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 22px;\">\n        <article style=\"padding: 34px; border: 1px solid rgba(255,255,255,.1); border-radius: 20px; background: linear-gradient(160deg, #0C1116, #080B0F); transition: transform .5s cubic-bezier(.16,.84,.28,1), border-color .4s ease, box-shadow .5s ease; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 26%;\" style-hover=\"transform: translateY(-6px); border-color: rgba(124,245,213,.4); box-shadow: 0 28px 60px -30px rgba(124,245,213,.35);\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #7CF5D5;\">Study 01 · EEG<\u002Fdiv>\n          <h4 style=\"margin: 14px 0 20px; font-size: 24px; font-weight: 600; line-height: 1.28; letter-spacing: -.015em; color: #F4F8FB; text-wrap: pretty;\">EEG markers of self-conflict and sleep quality in meditators vs. non-meditators<\u002Fh4>\n          <ul style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 13px;\">\n            <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 12px; font-size: 15.5px; line-height: 1.62; color: #A7B4C0;\"><span style=\"color: #7CF5D5;\">→<\u002Fspan><span>Designed and implemented an EEG-based emotional conflict paradigm in PsychoPy to probe self-referential processing.<\u002Fspan><\u002Fli>\n            <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 12px; font-size: 15.5px; line-height: 1.62; color: #A7B4C0;\"><span style=\"color: #7CF5D5;\">→<\u002Fspan><span>Collected high-density EEG and behavioural data from meditators and non-meditators under standardized conditions.<\u002Fspan><\u002Fli>\n            <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 12px; font-size: 15.5px; line-height: 1.62; color: #A7B4C0;\"><span style=\"color: #7CF5D5;\">→<\u002Fspan><span>Ran preprocessing, artifact rejection, ERP analysis and frontal midline theta analysis in MATLAB and EEGLAB.<\u002Fspan><\u002Fli>\n            <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 12px; font-size: 15.5px; line-height: 1.62; color: #A7B4C0;\"><span style=\"color: #7CF5D5;\">→<\u002Fspan><span>Administered PSQI, PANAS, ADS, PSS and BIS/BAS; contributed to statistics, interpretation and manuscript preparation.<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n        <article style=\"padding: 34px; border: 1px solid rgba(255,255,255,.1); border-radius: 20px; background: linear-gradient(160deg, #0C1116, #080B0F); transition: transform .5s cubic-bezier(.16,.84,.28,1), border-color .4s ease, box-shadow .5s ease; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 28%;\" style-hover=\"transform: translateY(-6px); border-color: rgba(158,139,255,.4); box-shadow: 0 28px 60px -30px rgba(158,139,255,.35);\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #9E8BFF;\">Study 02 · fNIRS<\u002Fdiv>\n          <h4 style=\"margin: 14px 0 20px; font-size: 24px; font-weight: 600; line-height: 1.28; letter-spacing: -.015em; color: #F4F8FB; text-wrap: pretty;\">Cognitive workload and mindfulness: an fNIRS N-back study<\u002Fh4>\n          <ul style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 13px;\">\n            <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 12px; font-size: 15.5px; line-height: 1.62; color: #A7B4C0;\"><span style=\"color: #9E8BFF;\">→<\u002Fspan><span>Ran fNIRS experiments on prefrontal cortical activation during working memory tasks.<\u002Fspan><\u002Fli>\n            <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 12px; font-size: 15.5px; line-height: 1.62; color: #A7B4C0;\"><span style=\"color: #9E8BFF;\">→<\u002Fspan><span>Analyzed HbO and HbR signals across N-back load levels in stressed and non-stressed participants.<\u002Fspan><\u002Fli>\n            <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 12px; font-size: 15.5px; line-height: 1.62; color: #A7B4C0;\"><span style=\"color: #9E8BFF;\">→<\u002Fspan><span>Supported experimental design, recruitment, acquisition, preprocessing and statistical analysis.<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: minmax(220px, .62fr) minmax(320px, 1.38fr); gap: 56px; padding: 96px 0; border-bottom: 1px solid rgba(255,255,255,.08);\">\n      <div style=\"position: sticky; top: 120px; align-self: start; animation: revealSide linear both; animation-timeline: view(); animation-range: entry 0% cover 24%;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #7CF5D5;\">2023 - 2025<\u002Fdiv>\n        <h3 style=\"margin: 14px 0 8px; font-size: 26px; font-weight: 600; letter-spacing: -.02em; color: #F4F8FB;\">M.Sc. Research<\u002Fh3>\n        <div style=\"font-size: 15px; line-height: 1.5; color: #8A98A6;\">Department of Physiology<br>AIIMS Nagpur, India<\u002Fdiv>\n        <div style=\"margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.1); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #66727E;\">fNIRS · HRV · Bibliometrics<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 22px;\">\n        <article style=\"padding: 34px; border: 1px solid rgba(124,245,213,.22); border-radius: 20px; background: linear-gradient(160deg, rgba(124,245,213,.07), #080B0F 55%); transition: transform .5s cubic-bezier(.16,.84,.28,1), border-color .4s ease, box-shadow .5s ease; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 26%;\" style-hover=\"transform: translateY(-6px); border-color: rgba(124,245,213,.5); box-shadow: 0 28px 60px -30px rgba(124,245,213,.35);\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #7CF5D5;\">Thesis · fNIRS intervention<\u002Fdiv>\n          <h4 style=\"margin: 14px 0 20px; font-size: 26px; font-weight: 600; line-height: 1.26; letter-spacing: -.015em; color: #F4F8FB; text-wrap: pretty;\">Effects of Yoga Nidra on prefrontal cortical activity and perceived stress in problematic social media use<\u002Fh4>\n          <ul style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 13px;\">\n            <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 12px; font-size: 15.5px; line-height: 1.62; color: #A7B4C0;\"><span style=\"color: #7CF5D5;\">→<\u002Fspan><span>Designed and ran an fNIRS interventional study comparing cortical activation before and after Yoga Nidra practice.<\u002Fspan><\u002Fli>\n            <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 12px; font-size: 15.5px; line-height: 1.62; color: #A7B4C0;\"><span style=\"color: #7CF5D5;\">→<\u002Fspan><span>Collected neuroimaging and behavioural data with standardized psychometric questionnaires.<\u002Fspan><\u002Fli>\n            <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 12px; font-size: 15.5px; line-height: 1.62; color: #A7B4C0;\"><span style=\"color: #7CF5D5;\">→<\u002Fspan><span>Preprocessed and analysed fNIRS signals, interpreted cortical hemodynamic responses, completed statistics and thesis.<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px;\">\n          <article style=\"padding: 28px; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; background: #0A0E13; transition: transform .5s cubic-bezier(.16,.84,.28,1), border-color .4s ease; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 30%;\" style-hover=\"transform: translateY(-5px); border-color: rgba(255,255,255,.26);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #66727E;\">Resting-state fNIRS<\u002Fdiv>\n            <h4 style=\"margin: 12px 0 14px; font-size: 19px; font-weight: 600; line-height: 1.34; color: #EAF0F4; text-wrap: pretty;\">Functional disconnection of the prefrontal cortex in heavy social media users<\u002Fh4>\n            <p style=\"margin: 0; font-size: 14.5px; line-height: 1.62; color: #96A3AF;\">Mapped resting-state prefrontal functional connectivity; ran preprocessing, connectivity analysis and interpretation of cortical network alterations.<\u002Fp>\n          <\u002Farticle>\n          <article style=\"padding: 28px; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; background: #0A0E13; transition: transform .5s cubic-bezier(.16,.84,.28,1), border-color .4s ease; animation: revealIn linear both; animation-timeline: view(); animation-range: entry 0% cover 32%;\" style-hover=\"transform: translateY(-5px); border-color: rgba(255,255,255,.26);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #66727E;\">Bibliometrics · VOSviewer<\u002Fdiv>\n            <h4 style=\"margin: 12px 0 14px; font-size: 19px; font-weight: 600; line-height: 1.34; color: #EAF0F4; text-wrap: pretty;\">Global trends in Internet Gaming Disorder, 1995-2024<\u002Fh4>\n            <p style=\"m
